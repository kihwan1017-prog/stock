name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_app
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: stock_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_app -d stock_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      JWT_DEV_AUTO_SECRET: "true"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: stock_platform
      DB_USER: stock_app
      DB_PASSWORD: change-me
      ADMIN_API_KEY: ci-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade
        run: python -m alembic upgrade head
      - name: Pytest + coverage gate
        run: |
          python -m pytest \
            --cov=stock_platform \
            --cov-report=term-missing \
            --cov-fail-under=25 \
            -m "not external and not live"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
